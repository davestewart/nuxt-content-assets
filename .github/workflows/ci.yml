name: CI

on:
  push:
    branches: [main, 'v[0-9]*', '[0-9]*.x']
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare module stubs and types
        run: npm run dev:prepare

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  # publishes version tags (e.g. v1.9.0) once the ci job passes, using npm trusted publishing
  publish:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # trusted publishing needs npm 11.5.1+
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

          # prereleases go to `next`, older majors (e.g. 1.x once 3.x is out) go to `legacy`
          if [[ "$version" == *-* ]]; then
            tag=next
          else
            latest=$(npm view "$(node -p "require('./package.json').name")" dist-tags.latest)
            if [ "${version%%.*}" -lt "${latest%%.*}" ]; then tag=legacy; else tag=latest; fi
          fi

          echo "Publishing $version with tag $tag"
          npm publish --tag "$tag"
